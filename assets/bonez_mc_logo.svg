<svg viewBox="0 0 900 230" role="img" aria-labelledby="bonez-logo-title" xmlns="http://www.w3.org/2000/svg">
  <title id="bonez-logo-title">Bonez MC Logo</title>
  <defs>
    <linearGradient id="bonez-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="bonez-rough">
